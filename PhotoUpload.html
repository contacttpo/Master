<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<script src="/gas-shim.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upload Photo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; }
  [x-cloak] { display: none !important; }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-start sm:items-center justify-center p-4">

<div x-data="photoApp()" x-init="init()" class="w-full max-w-md">

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="bg-gradient-to-r from-indigo-600 to-indigo-500 px-5 py-4">
      <p class="text-white font-semibold text-lg">Placement Cell</p>
      <p class="text-indigo-100 text-sm">Gyan Ganga Group<span x-show="companyName"> &middot; <span x-text="companyName"></span></span></p>
    </div>

    <div class="p-5">

      <!-- STEP 1: enter enrollment number -->
      <template x-if="step === 'lookup'">
        <div>
          <p class="text-sm text-slate-600 mb-4">Enter your Enrollment Number to continue.</p>
          <input type="text" x-model="enrollmentNo" @keyup.enter="lookup()"
            placeholder="Enrollment Number"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <p x-show="errorMsg" x-cloak x-text="errorMsg" class="text-red-600 text-sm mt-2"></p>
          <button @click="lookup()" :disabled="busy || !enrollmentNo.trim()"
            class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition-colors">
            <span x-text="busy ? 'Checking...' : 'Continue'"></span>
          </button>
        </div>
      </template>

      <!-- STEP 2: already submitted -->
      <template x-if="step === 'already'">
        <div class="text-center">
          <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-2xl">&#10003;</div>
          <p class="font-semibold text-slate-800">Thanks, <span x-text="studentName"></span>!</p>
          <p class="text-sm text-slate-500 mt-1">We already have a photo on file for you<span x-show="submittedAt"> (submitted <span x-text="submittedAt"></span>)</span>.</p>
          <button @click="step = 'upload'" class="mt-4 text-sm text-indigo-600 hover:underline">Need to replace it? Upload a new one</button>
        </div>
      </template>

      <!-- STEP 3: upload -->
      <template x-if="step === 'upload'">
        <div>
          <p class="text-sm text-slate-700 mb-1">Dear <span class="font-medium" x-text="studentName"></span>,</p>
          <p class="text-sm text-slate-600 mb-4">Please share your updated passport-sized photo.</p>

          <label class="block border-2 border-dashed border-slate-300 hover:border-indigo-400 rounded-xl p-5 text-center cursor-pointer transition-colors">
            <template x-if="!previewUrl">
              <div class="text-slate-400">
                <p class="text-sm">Tap to choose a photo</p>
                <p class="text-xs mt-1">JPG or PNG</p>
              </div>
            </template>
            <template x-if="previewUrl">
              <img :src="previewUrl" class="mx-auto max-h-48 rounded-lg object-contain">
            </template>
            <input type="file" accept="image/jpeg,image/png" class="hidden" @change="onFileChange($event)">
          </label>

          <p x-show="errorMsg" x-cloak x-text="errorMsg" class="text-red-600 text-sm mt-3"></p>

          <button @click="submitPhoto()" :disabled="busy || !selectedFile"
            class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition-colors">
            <span x-text="busy ? 'Uploading...' : 'Submit Photo'"></span>
          </button>
        </div>
      </template>

      <!-- STEP 4: done -->
      <template x-if="step === 'done'">
        <div class="text-center">
          <div class="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-3 text-2xl">&#10003;</div>
          <p class="font-semibold text-slate-800">Photo received — thank you!</p>
          <p class="text-sm text-slate-500 mt-1">The Placement Cell has been notified.</p>
        </div>
      </template>

    </div>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
  function photoApp() {
    return {
      companyName: PARAMS.company || '',
      step: 'lookup', // lookup -> already | upload -> done
      enrollmentNo: '',
      studentName: '',
      submittedAt: '',
      errorMsg: '',
      busy: false,
      selectedFile: null,
      previewUrl: '',

      init() {
        if (!this.companyName) {
          this.errorMsg = 'This link is missing the company name. Please use the exact link from the email.';
        }
      },

      lookup() {
        if (!this.enrollmentNo.trim()) return;
        this.errorMsg = '';
        this.busy = true;
        google.script.run
          .withSuccessHandler(res => {
            this.busy = false;
            if (!res.success) { this.errorMsg = res.message || 'Could not verify your details.'; return; }
            this.studentName = res.studentName || '';
            this.submittedAt = res.submittedAt || '';
            if (res.companyName) this.companyName = res.companyName; // exact text as stored on the sheet — guarantees the submit call below matches
            this.step = res.alreadySubmitted ? 'already' : 'upload';
          })
          .withFailureHandler(err => {
            this.busy = false;
            this.errorMsg = 'Error: ' + err.message;
          })
          .getPhotoRequestForStudent(this.companyName, this.enrollmentNo.trim());
      },

      onFileChange(event) {
        const file = event.target.files[0];
        this.errorMsg = '';
        if (!file) return;
        if (['image/jpeg', 'image/png'].indexOf(file.type) === -1) {
          this.errorMsg = 'Only JPG or PNG photos are accepted.';
          event.target.value = '';
          return;
        }
        const maxBytes = 8 * 1024 * 1024; // 8MB
        if (file.size > maxBytes) {
          this.errorMsg = 'Photo is too large (max 8MB).';
          event.target.value = '';
          return;
        }
        this.selectedFile = file;
        this.previewUrl = URL.createObjectURL(file);
      },

      submitPhoto() {
        if (!this.selectedFile) return;
        this.errorMsg = '';
        this.busy = true;
        const reader = new FileReader();
        reader.onload = (e) => {
          const base64 = e.target.result.split(',')[1];
          google.script.run
            .withSuccessHandler(res => {
              this.busy = false;
              if (res.success) {
                this.step = 'done';
              } else {
                this.errorMsg = res.message || 'Upload failed. Please try again.';
              }
            })
            .withFailureHandler(err => {
              this.busy = false;
              this.errorMsg = 'Error: ' + err.message;
            })
            .submitStudentPhoto(this.companyName, this.enrollmentNo.trim(), base64, this.selectedFile.name, this.selectedFile.type);
        };
        reader.readAsDataURL(this.selectedFile);
      }
    };
  }
</script>
</body>
</html>
