      const allChecked = boxes.length > 0 && Array.from(boxes).every(cb => cb.checked);
      selectAllBtn.textContent = allChecked ? 'Deselect all visible' : 'Select all visible';
    }
  }

  function confirmMark() {
    const a = state.current;
    const status = state.markMode;
    const ids = Array.from(state.selected);
    if (!ids.length) { toast('Tick at least one student first.'); return; }
    if (status === 'MoveGroup') { confirmMoveToGroup(ids); return; }
    // Spell out any decision this would OVERWRITE — that is exactly how
    // Shortlisted students end up Rejected by mistake.
    const changing = {};
    ids.forEach(en => {
      const st = state.students.find(x => String(x.Enrollment_No) === String(en));
      const prev = st && String(st.Result || '').trim();
      if (prev && prev !== status && (prev === 'Shortlisted' || prev === 'Rejected' || prev === 'Selected')) changing[prev] = (changing[prev] || 0) + 1;
    });
    const warn = Object.keys(changing).map(k => changing[k] + ' currently ' + k).join(', ');
    const msg = 'Mark ' + ids.length + ' student' + (ids.length > 1 ? 's' : '') + ' as ' + status + '?' +
      (warn ? '\n\n⚠ This will CHANGE the existing result of ' + warn + '.' : '');
    if (!confirm(msg)) return;
    // SPEED (perceived): update the screen immediately and let the server
    // catch up in the background; put the old values back if it fails.
    const before = {};
    ids.forEach(en => {
      const s = state.students.find(x => String(x.Enrollment_No) === String(en));
      if (s) { before[en] = s.Result; s.Result = status; }
    });
    state.pendingWrites++;
    exitMarkMode();
    refreshBoardDataOnly();
    const undoLocal = () => {
      Object.keys(before).forEach(en => {
        const s = state.students.find(x => String(x.Enrollment_No) === String(en));
        if (s) s.Result = before[en];
      });
      refreshBoardDataOnly();
    };
    google.script.run
      .withSuccessHandler(res => {
        state.pendingWrites--;
        if (!res.success) { undoLocal(); toast(res.message || 'Could not update.'); return; }
        toast(status === 'Shortlisted'
          ? ids.length + ' shortlisted — carried into the next round automatically.'
          : ids.length + ' marked ' + status + '.');
      })
      .withFailureHandler(err => { state.pendingWrites--; undoLocal(); toast('Error: ' + err.message); })
      .bulkSetRoundStatus(a.Company_Name, a.Round_Name, ids, status, null, a.Volunteer_Name, a.Volunteer_Mobile);
  }

  // Moves every ticked student into one target group. There's no bulk
  // group-move endpoint on the server, so this fires one setStudentGDGroup
  // call per student and waits for all of them before refreshing — still
  // one prompt and one confirmation for the whole batch from the
  // volunteer's side.
  function confirmMoveToGroup(ids) {
    const a = state.current;
    const target = prompt('Move ' + ids.length + ' student' + (ids.length > 1 ? 's' : '') + ' to which group number?');
    if (!target) return;
    const groupNo = parseInt(target.trim(), 10);
    if (!groupNo || groupNo < 1) { toast('Enter a valid group number.'); return; }
    if (!confirm('Move ' + ids.length + ' student' + (ids.length > 1 ? 's' : '') + ' to Group ' + groupNo + '?')) return;

    // SPEED: one server call for the whole batch (setStudentsGDGroup)
    // instead of one call per student.
    const before = {};
    ids.forEach(en => {
      const s = state.students.find(x => String(x.Enrollment_No) === String(en));
      if (s) { before[en] = s.Group_No; s.Group_No = groupNo; }
    });
    state.pendingWrites++;
    exitMarkMode();
    refreshBoardDataOnly();
    google.script.run
      .withSuccessHandler(res => {
        state.pendingWrites--;
        if (!res.success) { revertMove_(before); toast(res.message || 'Could not move.'); return; }
        toast('Moved ' + ids.length + ' student' + (ids.length > 1 ? 's' : '') + ' to Group ' + groupNo + '.');
      })
      .withFailureHandler(err => { state.pendingWrites--; revertMove_(before); toast('Error: ' + err.message); })
      .setStudentsGDGroup(a.Company_Name, a.Round_Name, ids, groupNo, null, a.Volunteer_Name, a.Volunteer_Mobile);
  }

  function revertMove_(before) {
    Object.keys(before).forEach(en => {
      const s = state.students.find(x => String(x.Enrollment_No) === String(en));
      if (s) s.Group_No = before[en];
    });
    refreshBoardDataOnly();
  }

  // Tapping a Pending / Shortlist / Rejected / Selected tile opens that
  // list (filters the board to just that status); tapping the same tile
  // again clears the filter.
  function wireCountClicks() {
    document.querySelectorAll('#countsRow .cnt').forEach(el => {
      el.onclick = () => {
        const status = el.getAttribute('data-status');
        state.statusFilter = (state.statusFilter === status) ? null : status;
        document.querySelectorAll('#countsRow .cnt').forEach(c =>
          c.classList.toggle('active-filter', c.getAttribute('data-status') === state.statusFilter));
        applyFilterHint();
        renderBoardBody();
      };
    });
  }

  function applyFilterHint() {
    const hint = document.getElementById('filterHint');
    if (!hint) return;
    if (state.statusFilter) {
      hint.style.display = 'block';
      hint.innerHTML = 'Showing <b>' + escapeHtml(state.statusFilter) + '</b> only · <span class="clear" id="clearFilterBtn">Clear</span>';
      document.getElementById('clearFilterBtn').onclick = () => {
        state.statusFilter = null;
        document.querySelectorAll('#countsRow .cnt').forEach(c => c.classList.remove('active-filter'));
        applyFilterHint();
        renderBoardBody();
      };
    } else {
      hint.style.display = 'none';
      hint.innerHTML = '';
    }
  }

  function filteredStudents() {
    const q = state.search.trim().toLowerCase();
    let list = state.students;
    if (state.statusFilter) {
      list = list.filter(s => {
        const r = (s.Result || '').trim();
        return state.statusFilter === 'Pending' ? !r : r === state.statusFilter;
      });
    }
    if (!q) return list;
    return list.filter(s =>
      String(s.Enrollment_No || '').toLowerCase().includes(q) ||
      String(s.Student_Name || '').toLowerCase().includes(q));
  }

  function renderBoardBody() {
    const body = document.getElementById('boardBody');
    const a = state.current;
    if (isGD(a.Round_Type)) {
      body.innerHTML = renderGDGroupsHtml();
      wireGDHandlers();
    } else {
      body.innerHTML = renderFlatListHtml(filteredStudents());
      wireCheckboxes(body);
    }
    updateBulkBar();
  }

  // Small colored ✓/✕ shown right before the student's name, matching the
  // buttons below (amber Shortlisted, red Rejected, green Selected) — a
  // quick visual cue without needing to look down at the button row.
  function statusTickHtml(s) {
    const r = (s.Result || '').trim();
    if (r === 'Appeared') return '<span class="tick appeared" title="Appeared">●</span>';
    if (r === 'Shortlisted') return '<span class="tick shortlisted" title="Shortlisted">✓</span>';
    if (r === 'Rejected') return '<span class="tick rejected" title="Rejected">✕</span>';
    if (r === 'Selected') return '<span class="tick selected" title="Selected">✓</span>';
    return '';
  }

  // A tick box in front of every name for multi-select, instead of a
  // Shortlist/Reject/Selected/Move-to-Group button on every row — those
  // live once in the bulk bar above the list instead (see
  // renderBulkBarHtml), so every row here is just the tick + name. The
  // checkbox renders for every student while a marking/move pass is active
  // (state.markMode set) — including already-decided ones, so a result can
  // be corrected by just ticking them again under the right status and
  // confirming.
  function studentRowHtml(s) {
    const en = String(s.Enrollment_No);
    const checked = state.selected.has(en) ? 'checked' : '';
    const showCheckbox = !!state.markMode;
    const st = String(s.Result || '').trim().toLowerCase();
    const stCls = ['appeared', 'shortlisted', 'rejected', 'selected'].indexOf(st) !== -1 ? ' st-' + st : '';
    return `
      <div class="student${stCls}">
        ${showCheckbox
          ? `<input type="checkbox" class="rowCheck" data-en="${escapeHtml(s.Enrollment_No)}" ${checked}>`
          : `<span class="rowCheckSpacer"></span>`}
        <div class="student-info">
          <div class="name">${statusTickHtml(s)}${escapeHtml(s.Student_Name || '(no name)')}</div>
          <div class="meta">${escapeHtml(s.Enrollment_No)} · ${escapeHtml(s.Branch || '')} ${s.College ? '· ' + escapeHtml(s.College) : ''}</div>
        </div>
      </div>
    `;
  }

  function renderFlatListHtml(students) {
    if (!students.length) return '<div class="stateMsg">No students found.</div>';
    return '<div class="card" style="padding:6px 18px;">' + students.map(s => studentRowHtml(s)).join('') + '</div>';
  }

  function wireCheckboxes(scopeEl) {
    scopeEl.querySelectorAll('.rowCheck').forEach(cb => {
      cb.onchange = () => {
        const en = cb.dataset.en;
        if (cb.checked) state.selected.add(en); else state.selected.delete(en);
        updateBulkBar();
      };
    });
  }

  // ---- GD groups ----

  // A round's Assigned_Groups (set by the admin, comma-separated group
  // numbers) restricts a volunteer to specific groups. Blank/absent means
  // unrestricted — they manage the whole round, same as before.
  function assignedGroupNumbers_(a) {
    return String(a.Assigned_Groups || '').split(',')
      .map(s => s.trim()).filter(Boolean).map(Number).filter(n => !isNaN(n));
  }

  function groupCardHtml_(g, members, size, managerLabel, filterActive, showDownload) {
    // Closed by default (state.openGroups starts empty each time a round is
    // opened) — the group name itself is the toggle button; tapping it
    // expands/collapses that one group without touching the others.
    // While a status filter or search is active, every rendered group
    // (which by this point only includes groups with a match) opens
    // automatically — otherwise tapping "Shortlisted" up top would compute
    // the right students but hide them behind still-collapsed group cards.
    const isOpen = !!filterActive || state.openGroups.has(g);
    return `
      <div class="groupCard">
        <button type="button" class="groupToggle" data-toggle-group="${g}">
          <div class="gname"><span class="chev">${isOpen ? '▾' : '▸'}</span>Group ${g}</div>
          <div class="gcount">${members.length}/${size}</div>
        </button>
        <div class="groupBody" style="display:${isOpen ? 'block' : 'none'};">
          <div class="groupManager">Managed by: ${managerLabel}</div>
          ${members.map(s => studentRowHtml(s)).join('')}
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
            <button class="btn ghost sm" data-add-group="${g}">+ Add Student</button>
            ${showDownload && members.length ? `
            <button class="btn ghost sm" data-dl-group="${g}" data-dl-format="xlsx">⤓ Excel</button>
            <button class="btn ghost sm" data-dl-group="${g}" data-dl-format="pdf">⤓ PDF</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  function renderGDGroupsHtml() {
    const a = state.current;
    const size = Math.max(1, parseInt(a.GD_Group_Size, 10) || 5);
    // Same gating as the header's "Download all groups" — Admin-role
    // volunteers only. Per-group download reuses the exact same rule so a
    // volunteer restricted to their own group(s) doesn't see a button that
    // would fail on the server (exportFormattedFile itself has no
    // permission check, so this is purely a UI-consistency choice).
    const showDownload = isGD(a.Round_Type) && a.Role === 'Admin';
    const grouped = {};
    const ungrouped = [];
    filteredStudents().forEach(s => {
      const g = s.Group_No;
      if (g === '' || g === null || g === undefined) { ungrouped.push(s); return; }
      (grouped[g] = grouped[g] || []).push(s);
    });
    const groupNos = Object.keys(grouped).map(Number).sort((x, y) => x - y);
    if (!groupNos.length) state.groupCount = Math.max(state.groupCount, Math.ceil(state.students.length / size) || 1);
    const totalGroups = Math.max(state.groupCount, groupNos.length ? Math.max(...groupNos) : 0);

    const myGroups = assignedGroupNumbers_(a);
    const restricted = myGroups.length > 0;
    const managerLabel = a.Volunteer_Name ? escapeHtml(a.Volunteer_Name) : 'you';

    // A status filter (tapping Pending/Shortlisted/Rejected/Selected up top)
    // or a search narrows down which students should be visible. When
    // that's the case, groups with no matching student are skipped
    // entirely (nothing useful to show), and every group that does have a
    // match is passed filterActive=true so groupCardHtml_ opens it
    // automatically instead of leaving the volunteer to hunt through
    // collapsed cards for the students they just asked to see.
    const filterActive = !!(state.statusFilter || state.search.trim());

    let html = '';

    if (restricted) {
      // Only the group(s) this volunteer was assigned — everything else in
      // this round belongs to another volunteer, so it's never rendered.
      const allKnownGroupNos = new Set(groupNos.concat(myGroups));
      const otherGroupNos = Array.from(allKnownGroupNos).filter(g => myGroups.indexOf(g) === -1);

      html += `<div class="section-title">Your Groups</div>`;
      const visibleMyGroups = myGroups.slice().sort((x, y) => x - y)
        .filter(g => !filterActive || (grouped[g] || []).length > 0);
      if (filterActive && !visibleMyGroups.length) {
        html += `<div class="hint">No matching students in your groups right now.</div>`;
      }
      visibleMyGroups.forEach(g => {
        html += groupCardHtml_(g, grouped[g] || [], size, managerLabel, filterActive, showDownload);
      });

      if (otherGroupNos.length) {
        html += `<div class="tpoNote">${otherGroupNos.length} other group${otherGroupNos.length > 1 ? 's' : ''} in this round ${otherGroupNos.length > 1 ? 'are' : 'is'} managed by other volunteers. If you need to manage one of them, please contact your TPO.</div>`;
      }
    } else {
      // Unrestricted — this volunteer manages the whole round, so every
      // group (and the ungrouped pool) is theirs, same as before.
      html += `
        <div class="section-title">Groups</div>
        <div class="hint" style="margin-bottom:12px;">Groups are set up by the admin. You're managing them here — tap "+ Add Student" on any group and type an enrollment number, or "Remove from group" to send them back to Ungrouped.</div>
      `;
      let anyShown = false;
      for (let g = 1; g <= totalGroups; g++) {
        const members = grouped[g] || [];
        if (filterActive && !members.length) continue;
        anyShown = true;
        html += groupCardHtml_(g, members, size, managerLabel, filterActive, showDownload);
      }
      if (filterActive && !anyShown) {
        html += `<div class="hint">No matching students in any group right now.</div>`;
      }
      html += `<button class="btn ghost" id="addGroupBtn" style="margin-bottom:18px;">+ Add Another Group</button>`;

      html += `<div class="section-title">Ungrouped (${ungrouped.length})</div>`;
      html += ungrouped.length
        ? '<div class="card" style="padding:6px 18px;">' + ungrouped.map(s => studentRowHtml(s)).join('') + '</div>'
        : '<div class="hint">Everyone has been placed into a group.</div>';
    }

    return html;
  }

  function wireGDHandlers() {
    const body = document.getElementById('boardBody');
    wireCheckboxes(body);
    body.querySelectorAll('[data-toggle-group]').forEach(btn => {
      btn.onclick = () => {
        const g = Number(btn.getAttribute('data-toggle-group'));
        if (state.openGroups.has(g)) state.openGroups.delete(g); else state.openGroups.add(g);
        renderBoardBody();
      };
    });
    body.querySelectorAll('[data-add-group]').forEach(btn => {
      btn.onclick = () => {
        const g = btn.getAttribute('data-add-group');
        const en = prompt('Enter the student\'s enrollment number to add to Group ' + g + ':');
        if (!en) return;
        addStudentToGroup(en.trim(), g);
      };
    });
    body.querySelectorAll('[data-dl-group]').forEach(btn => {
      btn.onclick = () => {
        const g = Number(btn.getAttribute('data-dl-group'));
        const format = btn.getAttribute('data-dl-format');
        downloadSingleGroupFromPortal(g, format, btn);
      };
    });
    const addGroupBtn = document.getElementById('addGroupBtn');
    if (addGroupBtn) addGroupBtn.onclick = () => { state.groupCount += 1; renderBoardBody(); };
  }

  // Downloads ONE group's list (Excel or PDF) — same look and same backend
  // call (exportFormattedFile, already built to take a multi-line banner
  // title) as downloadAllGroupsFromPortal above, just for a single group's
  // members instead of every group in one workbook.
  function downloadSingleGroupFromPortal(groupNo, format, btn, orientation) {
    if (state.downloadingGroups) return;
    if (format === 'pdf' && !orientation) { askPdfOrientation_(o => downloadSingleGroupFromPortal(groupNo, 'pdf', btn, o)); return; }
    const a = state.current;
    const members = state.students
      .filter(s => Number(s.Group_No) === groupNo)
      .slice().sort((x, y) => String(x.Student_Name || '').localeCompare(String(y.Student_Name || '')));
    if (!members.length) { toast('This group has no students yet.'); return; }

    const todayStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    const fields = [
      { key: 'Enrollment_No', label: 'Enrollment No' },
      { key: 'Student_Name', label: 'Student Name' },
      { key: 'Branch', label: 'Branch' },
      { key: 'College', label: 'College' },
      { key: 'Result', label: 'Result' }
    ];
    const title = [
      'GYAN GANGA INSTITUTE OF TECHNOLOGY & SCIENCES, JABALPUR',
      a.Company_Name || '',
      'Group ' + groupNo + '   •   ' + todayStr
    ];
    const rows = members.map(s => ({
      Enrollment_No: s.Enrollment_No, Student_Name: s.Student_Name,
      Branch: s.Branch || '', College: s.College || '', Result: s.Result || 'Pending'
    }));

    state.downloadingGroups = true;
    if (btn) btn.disabled = true;
    toast('Preparing download…');

    google.script.run
      .withSuccessHandler(res => {
        state.downloadingGroups = false;
        if (btn) btn.disabled = false;
        if (!res.success) { toast(res.message || 'Export failed'); return; }
        const byteChars = atob(res.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: res.mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = res.fileName;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      })
      .withFailureHandler(err => {
        state.downloadingGroups = false;
        if (btn) btn.disabled = false;
        toast('Error: ' + err.message);
      })
      .exportFormattedFile(title, fields, rows, format, format === 'pdf' ? orientation : '');
  }

  function addStudentToGroup(enrollmentNo, groupNo) {
    const a = state.current;
    const exists = state.students.some(s => String(s.Enrollment_No).toLowerCase() === enrollmentNo.toLowerCase());
    if (!exists) { toast('Enrollment number not found in this round\'s list.'); return; }
    google.script.run
      .withSuccessHandler(res => {
        if (!res.success) { toast(res.message || 'Could not add student.'); return; }
        toast('Added to Group ' + groupNo + '.');
        loadBoard(false);
      })
      .withFailureHandler(err => toast('Error: ' + err.message))
      .setStudentGDGroup(a.Company_Name, a.Round_Name, enrollmentNo, Number(groupNo), null, a.Volunteer_Name, a.Volunteer_Mobile);
  }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---- boot: restore the previous session if there is one ----
  function bootRestore_() {
    const sess = readSession_();
    if (!sess.mobile) { renderLogin(); return; }
    app.innerHTML = '<div class="stateMsg">Restoring your session…</div>';
    google.script.run
      .withSuccessHandler(res => {
        if (!res || !res.success) { clearSession_(); renderLogin(); return; }
        state.mobile = res.mobile;
        state.assignments = res.assignments;
        state.isPermanentAdmin = !!res.isPermanentAdmin;
        const a = sess.company && state.assignments.find(x =>
          x.Company_Name === sess.company && x.Round_Name === sess.round && !isAttendance(x));
        if (!a) { renderAssignments(); return; }
        // Reopen the company so Back returns to a sensible place, then the round itself.
        state.openCompanies.add(a.Company_Name);
        openRound(a);
        if (sess.rollCall) openRollCall();
      })
      // Offline / server hiccup: keep the saved session and let them retry with a refresh.
      .withFailureHandler(() => { renderLogin('Could not reach the server. Check your connection and refresh.'); })
      .volunteerLogin(sess.mobile);
  }
  bootRestore_();
</script>
</body>
</html>
