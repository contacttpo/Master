<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<script src="/gas-shim.js"></script>
<meta charset="UTF-8">
<title>Manage Volunteers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; background: #0f172a; color: #f1f5f9; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 50px; }
  .brand { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #818cf8; font-weight: 700; }
  h1 { font-size: 22px; margin: 2px 0 16px; }
  input, select {
    width: 100%; padding: 12px 13px; font-size: 15px; border: 1px solid #334155;
    border-radius: 10px; background: #1e293b; color: #f1f5f9; margin-bottom: 12px;
  }
  input:focus, select:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.25); }
  label { font-size: 12px; color: #94a3b8; display: block; margin: 0 0 4px; }
  .btn { padding: 12px 16px; font-size: 14px; font-weight: 600; color: #fff; background: #4f46e5; border: none; border-radius: 10px; cursor: pointer; }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
  .btn.danger { background: #7f1d1d; }
  .err { color: #f87171; font-size: 13px; margin: -6px 0 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; background: #1e293b; color: #94a3b8; font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid #263449; }
  .tab.active { background: #312e81; color: #fff; border-color: #4f46e5; }
  .card { background: #1e293b; border: 1px solid #263449; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #263449; }
  th { color: #94a3b8; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .liveCard { background: #1e293b; border: 1px solid #263449; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .liveCard .co { font-weight: 700; font-size: 15px; }
  .liveCard .rd { font-size: 12px; color: #a5b4fc; margin: 1px 0 10px; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .cnt { background: #0f172a; border-radius: 8px; padding: 6px 10px; text-align: center; min-width: 58px; }
  .cnt .n { font-size: 15px; font-weight: 700; } .cnt .l { font-size: 9px; color: #64748b; text-transform: uppercase; }
  .cnt.pending .n { color: #94a3b8; } .cnt.appeared .n { color: #38bdf8; }
  .cnt.shortlisted .n { color: #fbbf24; } .cnt.rejected .n { color: #f87171; } .cnt.selected .n { color: #34d399; }
  .vlist { font-size: 12px; color: #64748b; margin-top: 8px; }
  .stateMsg { text-align: center; color: #94a3b8; padding: 30px 10px; font-size: 14px; }
  .shareLink { font-size: 12px; color: #818cf8; word-break: break-all; margin-bottom: 16px; }
  .hint { font-size: 12px; color: #64748b; margin: -6px 0 12px; }
  .roundCheckList { border: 1px solid #334155; border-radius: 10px; background: #1e293b; margin-bottom: 4px; max-height: 220px; overflow-y: auto; }
  .roundCheckItem { display: flex; align-items: center; gap: 10px; padding: 10px 13px; font-size: 14px; border-bottom: 1px solid #263449; cursor: pointer; }
  .roundCheckItem:last-child { border-bottom: none; }
  .roundCheckItem input { width: auto; margin: 0; accent-color: #4f46e5; }
  .roundCheckItem:hover { background: #263449; }
  .roundCheckActions { display: flex; gap: 8px; margin: 8px 0 12px; }
  .roundCheckActions button { flex: none; padding: 6px 10px; font-size: 12px; font-weight: 600; color: #a5b4fc; background: transparent; border: 1px solid #334155; border-radius: 8px; cursor: pointer; }
  .roleToggle { display: flex; gap: 10px; margin-bottom: 6px; }
  .roleBtn { flex: 1; padding: 12px; font-size: 14px; font-weight: 700; border-radius: 10px; border: 1.5px solid #334155; background: #1e293b; color: #cbd5e1; cursor: pointer; }
  .roleBtn.active { background: #312e81; border-color: #4f46e5; color: #fff; }
  .roundCheckList.locked { opacity: .45; pointer-events: none; }
  .adminBadge { font-size: 9px; font-weight: 800; text-transform: uppercase; background: #312e81; color: #a5b4fc; padding: 2px 6px; border-radius: 5px; margin-left: 6px; }
  .statusBadge { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; }
  .statusBadge.status-active { background: #064e3b; color: #6ee7b7; }
  .statusBadge.status-paused { background: #78350f; color: #fcd34d; }
  .statusBadge.status-stopped { background: #7f1d1d; color: #fca5a5; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
  const app = document.getElementById('app');
  let session = { token: null };
  let data = { companies: [], roundsByCompany: {} };
  let activeTab = 'assign';
  let livePollTimer = null;

  function renderLogin(errMsg) {
    app.innerHTML = `
      <div class="brand">Campus Placement Tracker</div>
      <h1>Manage Volunteers</h1>
      <label>Username</label>
      <input id="u" autofocus>
      <label>Password</label>
      <input id="p" type="password">
      ${errMsg ? '<div class="err">' + errMsg + '</div>' : ''}
      <button class="btn" id="loginBtn" style="width:100%;">Log In</button>
    `;
    document.getElementById('loginBtn').onclick = () => {
      const u = document.getElementById('u').value.trim();
      const p = document.getElementById('p').value;
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Checking…';
      google.script.run
        .withSuccessHandler(res => {
          if (!res.success) { renderLogin(res.message); return; }
          session.token = res.token;
          loadCompaniesAndShell();
        })
        .withFailureHandler(err => renderLogin('Error: ' + err.message))
        .checkLogin(u, p);
    };
  }

  function loadCompaniesAndShell() {
    app.innerHTML = '<div class="stateMsg">Loading…</div>';
    google.script.run
      .withSuccessHandler(res => {
        if (!res.success) { app.innerHTML = '<div class="stateMsg">' + res.message + '</div>'; return; }
        data.companies = res.companies;
        data.roundsByCompany = res.roundsByCompany;
        renderShell();
      })
      .withFailureHandler(err => { app.innerHTML = '<div class="stateMsg">Error: ' + err.message + '</div>'; })
      .getCompaniesAndRoundsForVolunteerAdmin();
  }

  function renderShell() {
    clearInterval(livePollTimer);
    app.innerHTML = `
      <div class="brand">Campus Placement Tracker</div>
      <h1>Manage Volunteers</h1>
      <div class="shareLink" id="portalLink">Loading volunteer portal link…</div>
      <div class="tabs">
        <div class="tab ${activeTab === 'assign' ? 'active' : ''}" data-tab="assign">Assign Volunteers</div>
        <div class="tab ${activeTab === 'live' ? 'active' : ''}" data-tab="live">Live Overview</div>
      </div>
      <div id="tabBody"></div>
    `;
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.tab; renderShell(); });
    google.script.run.withSuccessHandler(url => {
      const el = document.getElementById('portalLink');
      if (el) el.innerHTML = 'Share this ONE link with every volunteer: <b>' + url + '</b>';
    }).getVolunteerPortalUrl();

    if (activeTab === 'assign') renderAssignTab();
    else renderLiveTab();
  }

  // -----------------------------------------------------------------
  // ASSIGN TAB
  // -----------------------------------------------------------------
  let assignSelectedCompany = data.companies[0] || '';
  let assignSelectedRole = 'Volunteer';

  function renderAssignTab() {
    const body = document.getElementById('tabBody');
    if (!assignSelectedCompany && data.companies.length) assignSelectedCompany = data.companies[0];
    // 'Attendance' is always offered as the first option, for every company,
    // whether or not any interview rounds have been added yet — it isn't a
    // real Process_Tracking round, it's the volunteer's kiosk/check-in
    // access grant (see verifyVolunteerMobile in Code.gs). Assigning it here
    // is the ONLY thing an admin needs to do to give someone QR-kiosk
    // access — same "Manage Volunteers" screen, same login link they
    // already use for round management.
    const realRounds = data.roundsByCompany[assignSelectedCompany] || [];
    const rounds = ['Attendance'].concat(realRounds);

    body.innerHTML = `
      <div class="card">
        <h3>Assign a Volunteer</h3>
        <label>Volunteer Role</label>
        <div class="roleToggle" id="roleToggle">
          <button type="button" class="roleBtn" data-role="Volunteer">Volunteer</button>
          <button type="button" class="roleBtn" data-role="Admin">Admin</button>
        </div>
        <div class="hint" id="roleHint" style="margin-top:-4px;">${assignSelectedRole === 'Admin'
          ? 'Admin volunteers are assigned every round for this company automatically — including rounds you add later — and get the "Download all groups" button on GD rounds in their Volunteer Portal.'
          : 'Regular volunteers only get the rounds picked below.'}</div>
        <label>Company</label>
        <select id="companySel">
          ${data.companies.map(c => `<option value="${escapeHtml(c)}" ${c === assignSelectedCompany ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        </select>
        <label>Rounds — select one or more</label>
        <div class="roundCheckActions" style="${assignSelectedRole === 'Admin' ? 'opacity:.4;pointer-events:none;' : ''}">
          <button type="button" class="ghost" id="roundSelAllBtn">Select all</button>
          <button type="button" class="ghost" id="roundClearBtn">Clear</button>
        </div>
        <div class="roundCheckList ${assignSelectedRole === 'Admin' ? 'locked' : ''}" id="roundCheckList">
          ${rounds.map(r => `
            <label class="roundCheckItem">
              <input type="checkbox" class="roundCheck" value="${escapeHtml(r)}" ${assignSelectedRole === 'Admin' ? 'checked' : ''}>
              ${escapeHtml(r === 'Attendance' ? 'Attendance (QR Kiosk)' : r)}
            </label>
          `).join('')}
        </div>
        <div class="hint" id="roundHint">Select every round this volunteer should manage — they'll be assigned to all of them at once. Only one volunteer can manage a (non-GD) round at a time — assigning it here replaces whoever currently has it.</div>
        <div id="roundTypeGrid" class="grid2">
          <div>
            <label>Round Type</label>
            <select id="roundType">
              <option>Online Test</option>
              <option>GD</option>
              <option>Technical Interview</option>
              <option>Managerial Round</option>
              <option>HR Interview</option>
              <option>Other</option>
            </select>
          </div>
          <div id="gdSizeWrap" style="display:none;">
            <label>Students per GD Group</label>
            <input id="gdSize" type="number" min="2" value="5">
          </div>
        </div>
        <label>Volunteer Mobile Number</label>
        <input id="volMobile" type="tel" inputmode="numeric" placeholder="10-digit mobile number">
        <label>Volunteer Name (optional)</label>
        <input id="volName" placeholder="For your own reference">
        <div class="err" id="assignErr" style="display:none;"></div>
        <button class="btn" id="assignBtn">Assign Volunteer</button>
      </div>
      <div class="card">
        <h3>Currently Assigned — ${escapeHtml(assignSelectedCompany || '')}</h3>
        <div id="assignedList"><div class="stateMsg">Loading…</div></div>
      </div>
    `;
    document.querySelectorAll('.roleBtn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.role === assignSelectedRole);
      btn.onclick = () => {
        // Admin: auto-select (and lock) every round, same as the main
        // app's Assign Volunteers tab — the backend enforces this too, but
        // showing it checked here means the form matches what's about to
        // happen instead of looking like a partial pick. The checked state
        // itself comes from the roundCheckList template above, keyed off
        // assignSelectedRole, so a full re-render is enough.
        assignSelectedRole = btn.dataset.role;
        renderAssignTab();
      };
    });
    document.getElementById('companySel').onchange = e => { assignSelectedCompany = e.target.value; renderAssignTab(); };
    document.getElementById('roundType').onchange = e => {
      document.getElementById('gdSizeWrap').style.display = e.target.value === 'GD' ? 'block' : 'none';
    };
    document.querySelectorAll('.roundCheck').forEach(cb => { cb.onchange = updateRoundTypeVisibility; });
    document.getElementById('roundSelAllBtn').onclick = () => {
      document.querySelectorAll('.roundCheck').forEach(cb => { cb.checked = true; });
      updateRoundTypeVisibility();
    };
    document.getElementById('roundClearBtn').onclick = () => {
      document.querySelectorAll('.roundCheck').forEach(cb => { cb.checked = false; });
      updateRoundTypeVisibility();
    };
    document.getElementById('assignBtn').onclick = submitAssignment;
    updateRoundTypeVisibility();
    loadAssignedList();
  }

  function checkedRounds_() {
    return Array.from(document.querySelectorAll('.roundCheck:checked')).map(cb => cb.value);
  }

  // Attendance doesn't have a "type" (Online Test/GD/etc) or a GD group
  // size — it's a plain access grant — so that part of the form hides
  // itself whenever Attendance is the ONLY thing checked. As soon as any
  // real round is also checked, the Round Type / GD size fields reappear —
  // they apply to every real round in the selection; Attendance is always
  // saved as a plain access grant regardless.
  function updateRoundTypeVisibility() {
    const rounds = checkedRounds_();
    const onlyAttendance = rounds.length > 0 && rounds.every(r => r === 'Attendance');
    document.getElementById('roundTypeGrid').style.display = onlyAttendance ? 'none' : 'grid';
    document.getElementById('roundHint').textContent = onlyAttendance
      ? 'This gives the number access to the Attendance / QR Kiosk button in their Volunteer Portal for this company — no separate kiosk link needed.'
      : 'Select every round this volunteer should manage — they\'ll be assigned to all of them at once. Only one volunteer can manage a (non-GD) round at a time — assigning it here replaces whoever currently has it. If Attendance is also checked, it\'s granted separately as plain kiosk access.';
  }

  function submitAssignment() {
    const company = document.getElementById('companySel').value;
    const rounds = checkedRounds_();
    const hasRealRound = rounds.some(r => r !== 'Attendance');
    const roundType = hasRealRound ? document.getElementById('roundType').value : '';
    const gdSize = (hasRealRound && document.getElementById('gdSize')) ? document.getElementById('gdSize').value : '';
    const mobile = document.getElementById('volMobile').value.trim();
    const name = document.getElementById('volName').value.trim();
    const errEl = document.getElementById('assignErr');
    errEl.style.display = 'none';
    if (!company) { errEl.textContent = 'Add rounds for this company in the main app first.'; errEl.style.display = 'block'; return; }
    if (assignSelectedRole !== 'Admin' && !rounds.length) { errEl.textContent = 'Select at least one round to assign.'; errEl.style.display = 'block'; return; }
    if (!mobile) { errEl.textContent = 'Enter the volunteer\'s mobile number.'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('assignBtn');
    btn.disabled = true; btn.textContent = 'Assigning…';
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false; btn.textContent = 'Assign Volunteer';
        if (!res.success) { errEl.textContent = res.message; errEl.style.display = 'block'; return; }
        document.getElementById('volMobile').value = '';
        document.getElementById('volName').value = '';
        assignSelectedRole = 'Volunteer';
        renderAssignTab();
      })
      .withFailureHandler(err => {
        btn.disabled = false; btn.textContent = 'Assign Volunteer';
        errEl.textContent = 'Error: ' + err.message; errEl.style.display = 'block';
      })
      .saveRoundVolunteerAssignments({
        Company_Name: company, Rounds: rounds, Round_Type: roundType,
        GD_Group_Size: gdSize, Volunteer_Mobile: mobile, Volunteer_Name: name,
        Role: assignSelectedRole
      });
  }

  function loadAssignedList() {
    google.script.run
      .withSuccessHandler(res => {
        const el = document.getElementById('assignedList');
        if (!el) return;
        if (!res.success) { el.innerHTML = '<div class="stateMsg">' + res.message + '</div>'; return; }
        if (!res.data.length) { el.innerHTML = '<div class="stateMsg">No volunteers assigned for this company yet.</div>'; return; }
        el.innerHTML = `
          <table>
            <tr><th>Round</th><th>Type</th><th>Mobile</th><th>Name</th><th>Status</th><th></th></tr>
            ${res.data.map(r => `
              <tr>
                <td>${escapeHtml(r.Round_Name)}${r.Role === 'Admin' ? '<span class="adminBadge">Admin</span>' : ''}</td>
                <td>${escapeHtml(r.Round_Type)}</td>
                <td>${escapeHtml(r.Volunteer_Mobile)}</td>
                <td>${escapeHtml(r.Volunteer_Name)}</td>
                <td><span class="statusBadge status-${escapeHtml((r.Access_Status || 'Active').toLowerCase())}">${escapeHtml(r.Access_Status || 'Active')}</span></td>
                <td style="white-space:nowrap;">
                  <button class="btn ghost" style="padding:6px 8px;font-size:12px;" title="Play" ${r.Access_Status === 'Active' || !r.Access_Status ? 'disabled' : ''} data-status-round="${escapeHtml(r.Round_Name)}" data-status-mobile="${escapeHtml(r.Volunteer_Mobile)}" data-status-set="Active">▶</button>
                  <button class="btn ghost" style="padding:6px 8px;font-size:12px;" title="Pause" ${r.Access_Status === 'Paused' ? 'disabled' : ''} data-status-round="${escapeHtml(r.Round_Name)}" data-status-mobile="${escapeHtml(r.Volunteer_Mobile)}" data-status-set="Paused">⏸</button>
                  <button class="btn ghost" style="padding:6px 8px;font-size:12px;" title="Stop" ${r.Access_Status === 'Stopped' ? 'disabled' : ''} data-status-round="${escapeHtml(r.Round_Name)}" data-status-mobile="${escapeHtml(r.Volunteer_Mobile)}" data-status-set="Stopped">⏹</button>
                  <button class="btn danger" style="padding:6px 10px;font-size:12px;" data-del-round="${escapeHtml(r.Round_Name)}" data-del-mobile="${escapeHtml(r.Volunteer_Mobile)}">Remove</button>
                </td>
              </tr>
            `).join('')}
          </table>
        `;
        el.querySelectorAll('[data-del-round]').forEach(btn => {
          btn.onclick = () => {
            if (!confirm('Remove this volunteer from this round?')) return;
            google.script.run
              .withSuccessHandler(loadAssignedList)
              .withFailureHandler(err => alert('Error: ' + err.message))
              .deleteRoundVolunteerAssignment(assignSelectedCompany, btn.dataset.delRound, btn.dataset.delMobile);
          };
        });
        el.querySelectorAll('[data-status-set]').forEach(btn => {
          btn.onclick = () => {
            google.script.run
              .withSuccessHandler(res2 => {
                if (!res2.success) { alert(res2.message); return; }
                loadAssignedList();
              })
              .withFailureHandler(err => alert('Error: ' + err.message))
              .setRoundVolunteerAccessStatus(assignSelectedCompany, btn.dataset.statusRound, btn.dataset.statusMobile, btn.dataset.statusSet);
          };
        });
      })
      .withFailureHandler(err => { const el = document.getElementById('assignedList'); if (el) el.innerHTML = 'Error: ' + err.message; })
      .getRoundVolunteerAssignments(assignSelectedCompany);
  }

  // -----------------------------------------------------------------
  // LIVE OVERVIEW TAB
  // -----------------------------------------------------------------
  function renderLiveTab() {
    const body = document.getElementById('tabBody');
    body.innerHTML = '<div class="hint">Refreshes automatically every few seconds.</div><div id="liveBody"><div class="stateMsg">Loading…</div></div>';
    loadLive();
    clearInterval(livePollTimer);
    livePollTimer = setInterval(loadLive, 5000);
  }

  function loadLive() {
    google.script.run
      .withSuccessHandler(res => {
        const el = document.getElementById('liveBody');
        if (!el) return;
        if (!res.success) { el.innerHTML = '<div class="stateMsg">' + res.message + '</div>'; return; }
        if (!res.data.length) { el.innerHTML = '<div class="stateMsg">No volunteers assigned yet — use "Assign Volunteers" to get started.</div>'; return; }
        el.innerHTML = res.data.map(r => {
          // Attendance has no Pending/Shortlisted/etc — it's just kiosk
          // access — so it gets its own simpler card instead of a row of
          // meaningless zero counts.
          if (r.isAttendance) {
            return `
              <div class="liveCard">
                <div class="co">${escapeHtml(r.Company_Name)}</div>
                <div class="rd">Attendance · QR Kiosk access</div>
                <div class="vlist">Volunteer(s): ${r.volunteers.map(escapeHtml).join(', ')}</div>
              </div>
            `;
          }
          return `
          <div class="liveCard">
            <div class="co">${escapeHtml(r.Company_Name)}</div>
            <div class="rd">${escapeHtml(r.Round_Name)} · ${escapeHtml(r.Round_Type)} · ${r.total} student${r.total === 1 ? '' : 's'}</div>
            <div class="counts">
              <div class="cnt pending"><div class="n">${r.counts.Pending}</div><div class="l">Pending</div></div>
              <div class="cnt appeared"><div class="n">${r.counts.Appeared}</div><div class="l">Appeared</div></div>
              <div class="cnt shortlisted"><div class="n">${r.counts.Shortlisted}</div><div class="l">Shortlist</div></div>
              <div class="cnt rejected"><div class="n">${r.counts.Rejected}</div><div class="l">Rejected</div></div>
              <div class="cnt selected"><div class="n">${r.counts.Selected}</div><div class="l">Selected</div></div>
            </div>
            <div class="vlist">Volunteer(s): ${r.volunteers.map(escapeHtml).join(', ')}</div>
          </div>
        `;
        }).join('');
      })
      .withFailureHandler(err => { const el = document.getElementById('liveBody'); if (el) el.innerHTML = 'Error: ' + err.message; })
      .getVolunteerLiveOverview();
  }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  renderLogin();
</script>
</body>
</html>
